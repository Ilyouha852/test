services:
  app:
    image: cajodev/support-bot-app:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.support-bot.entrypoints=httpLocal"
        - "traefik.http.routers.support-bot.rule=Host(`study.dev.fardrive.ru`)"
        # - "traefik.http.middlewares.support-bot-stripprefix.stripprefix.prefixes=/support-bot"
        # - "traefik.http.routers.support-bot.middlewares=support-bot-stripprefix"
        - "traefik.http.services.support-bot.loadbalancer.server.port=3001"
        - "traefik.docker.network=proxy"
    environment:
      - NODE_ENV=test
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_REGION=us-east-1
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=support-bot
      - DYNAMODB_ENDPOINT=http://dynamodb:8000
      - PORT=3001
    depends_on:
      - minio
      - dynamodb
    networks:
      - default
      - proxy

  minio:
    image: minio/minio:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.minio.entrypoints=httpLocal"
        - "traefik.http.routers.minio.rule=Host(`study.dev.fardrive.ru`) && PathPrefix(`/minio`)"
        - "traefik.http.middlewares.minio-stripprefix.stripprefix.prefixes=/minio"
        - "traefik.http.routers.minio.middlewares=minio-stripprefix"
        - "traefik.http.services.minio.loadbalancer.server.port=9000"
        - "traefik.docker.network=proxy"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - default
      - proxy

  minio-console:
    image: minio/minio:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.minio-console.entrypoints=httpLocal"
        - "traefik.http.routers.minio-console.rule=Host(`study.dev.fardrive.ru`) && PathPrefix(`/minio-console`)"
        - "traefik.http.middlewares.minio-console-stripprefix.stripprefix.prefixes=/minio-console"
        - "traefik.http.routers.minio-console.middlewares=minio-console-stripprefix"
        - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
        - "traefik.docker.network=proxy"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: minio server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - default
      - proxy

  dynamodb:
    image: amazon/dynamodb-local:latest
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    command: -jar DynamoDBLocal.jar -sharedDb
    volumes:
      - dynamodb_data:/home/dynamodblocal

volumes:
  minio_data:
    driver: local
  dynamodb_data:
    driver: local

networks:
  proxy:
    external: true